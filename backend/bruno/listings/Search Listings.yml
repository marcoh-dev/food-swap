info:
  name: Search Listings
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/listings?term=to&place={{placeSlug}}&radius=20"
  params:
    - name: term
      value: to
      type: query
    - name: place
      value: "{{placeSlug}}"
      type: query
    - name: radius
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
