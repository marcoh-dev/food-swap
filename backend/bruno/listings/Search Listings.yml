info:
  name: Search Listings
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/listings?term=to&location=ha"
  params:
    - name: term
      value: to
      type: query
    - name: location
      value: ha
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
