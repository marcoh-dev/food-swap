info:
  name: Find Chat for Listing
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/chats/listing/:listingId"
  params:
    - name: listingId
      value: "{{listingId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
