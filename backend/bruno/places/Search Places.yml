info:
  name: Search Places
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/places"
  params:
    - name: q
      value: hmaburg
      type: query
    - name: q
      value: "223"
      type: query
      disabled: true

runtime:
  scripts:
    - type: after-response
      code: |-
        const place = res.body.find((entry) => entry.postalCode);
        if (place) {
          bru.setVar("placeId", place.id);
        }
        if (res.body[0]) {
          bru.setVar("placeSlug", res.body[0].slug);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
