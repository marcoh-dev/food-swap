info:
  name: Login
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseURL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "simon",
        "password": "Pomodoro!1"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Store the token; the collection's bearer auth uses {{token}}
        if (res.status === 201) {
          bru.setVar("token", res.body.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
